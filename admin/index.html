<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Мой Дом</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
    .login-btn { padding: 15px 30px; background: #1c2e5a; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .login-btn:hover { background: #cc2229; }
  </style>
</head>
<body>
  <!-- Кнопка входа -->
  <button class="login-btn" id="login-btn">Войти в панель управления</button>

  <!-- Скрипты загружаются в самом конце, когда body уже создан -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // Инициализация виджета и обработка нажатия кнопки
    document.addEventListener('DOMContentLoaded', () => {
      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({
          APIUrl: "https://astonishing-churros-80144a.netlify.app/.netlify/identity"
        });
      }

      const loginBtn = document.getElementById('login-btn');
      if (loginBtn) {
        loginBtn.addEventListener('click', () => {
          if (window.netlifyIdentity) {
            window.netlifyIdentity.open();
          }
        });
      }
    });
  </script>
</body>
</html>
