site_url: https://sergeyberlov20-cmd.github.io/moy-dom

backend:
  name: github
  repo: sergeyberlov20-cmd/moy-dom
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "objects"
    label: "Каталог объектов"
    files:
      - name: "objects-list"
        label: "Список недвижимости"
        file: "js/data.json"
        fields:
          - label: "Объекты"
            name: "objects"
            widget: "list"
            summary: "{{fields.type}} - {{fields.title}}"
            fields:
              # --- СНАЧАЛА ФОТО ---
              - {label: "Главное фото (обложка)", name: "image", widget: "image"}
              - {label: "Галерея фото (все фото объекта)", name: "images", widget: "list", field: {label: "Фото", name: "image", widget: "image"}}
              
              # --- ЗАТЕМ БОЛЬШОЕ ОПИСАНИЕ ---
              - {label: "Описание объекта", name: "description", widget: "text", hint: "Распишите подробно: ремонт, инфраструктура, мебель, причины продажи и т.д. (Можно использовать переносы строк)."}

              # --- ОСНОВНЫЕ ХАРАКТЕРИСТИКИ ---
              - {label: "Тип", name: "type", widget: "select", options: ["Квартира", "Дом", "Офис", "Гараж"]}
              - {label: "Сделка", name: "deal", widget: "select", options: ["Продажа", "Аренда"]}
              - {label: "Заголовок", name: "title", widget: "string"}
              - {label: "Цена", name: "price", widget: "number"}
              - {label: "Адрес", name: "address", widget: "string"}
              - {label: "Комнат", name: "rooms", widget: "number", default: 0}
              - {label: "Площадь (м²)", name: "area", widget: "number", default: 0, required: false}
              - {label: "Этаж", name: "floor", widget: "number", default: 0, required: false}
              - {label: "Этажей в доме", name: "floors", widget: "number", default: 0, required: false}
              - {label: "Широта", name: "lat", widget: "number", required: false}
              - {label: "Долгота", name: "lon", widget: "number", required: false}
              
              # --- СЛУЖЕБНЫЕ ПОЛЯ ---
              - {label: "ID (число)", name: "id", widget: "number", hint: "Оставьте как есть при редактировании. Для нового напишите любое (например, 1001)."}
              - {label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
