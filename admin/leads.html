+(cls?" "+cls:"")};async function api(path,options){const opts=options||{},headers=Object.assign({},opts.headers||{});token&&(headers.Authorization="Bearer "+token),opts.body&&(headers["Content-Type"]="application/json");const r=await fetch(API+path,Object.assign({},opts,{headers:headers}));if(401===r.status)throw new Error("auth");if(!r.ok)throw new Error("http "+r.status);return r}function showLogin(text,cls){$("#app-view").hidden=!0,$("#login-view").hidden=!1,$("#logout").hidden=!0,text&&setMsg($("#login-msg"),text,cls)}function showApp(){$("#login-view").hidden=!0,$("#app-view").hidden=!1,$("#logout").hidden=!1}function fmtDate(s){if(!s)return"";const d=new Date(String(s).replace(" ","T")+"Z");return isNaN(d.getTime())?s:d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}function esc(s){return String(null==s?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}async function loadBotStats(){try{const r=await api("/api/admin/botstats"),b=await r.json();if(!b.ok)return;$("#bot-badge").textContent=(b.total||0)+" чел. · "+(b.week||0)+" за 7 дней";const totals='<div class="bot-totals"><span>Всего писавших: <b>'+(b.total||0)+"</b></span><span>С доступом: <b>"+(b.withAccess||0)+"</b></span><span>Сегодня: <b>"+(b.today||0)+"</b></span><span>За 7 дней: <b>"+(b.week||0)+"</b></span><span>Активных приглашений: <b>"+(b.activeInvites||0)+"</b></span></div>",users=(b.users||[]).map(function(u){const mark=u.allowed?'<span class="bot-yes">есть доступ</span>':'<span class="bot-no">нет доступа</span>';return'<div class="bot-row"><span class="who">'+esc(u.name||"без имени")+"</span>"+(u.username?'<span class="un">'+esc(u.username)+"</span>":"")+'<span class="un">ID '+esc(u.user_id)+"</span>"+mark+'<span class="meta">сообщений '+(u.messages||0)+" · команд "+(u.commands||0)+" · был "+esc(u.last_seen)+" UTC</span></div>"}).join("");$("#bot-users").innerHTML=totals+(users||'<div class="bot-row">Пока никто не писал боту
