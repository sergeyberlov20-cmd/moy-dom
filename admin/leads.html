<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c2e5a">
  <link rel="icon" type="image/png" href="../images/icon-192.png">
  <title>Заявки — панель «Мой Дом»</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary:#1c2e5a; --accent:#cc2229; --muted:#6b7280; --border:#e5e7eb; --bg:#f6f7fb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color:#111827; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 18px; }
    header.ph { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
    .ph-row { display: flex; align-items: center; gap: 12px; height: 64px; }
    .ph-row img { height: 34px; width: auto; }
    .ph-title { font-weight: 900; color: var(--primary); font-size: 1.05rem; letter-spacing: .2px; }
    .ph-title span { color: var(--accent); }
    .spacer { flex: 1; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font-weight: 700; font-size: .92rem; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #0f172a; }
    .btn.ghost { background: #fff; color: var(--primary); }
    .btn.ghost:hover { background: #f1f5f9; }
    .btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 8px; }
    .btn[disabled] { opacity: .5; cursor: default; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 26px; margin: 24px 0; box-shadow: 0 8px 24px rgba(15,23,42,.05); }
    .card h1 { margin: 0 0 8px; font-size: 1.4rem; color: var(--primary); }
    .card p { color: var(--muted); margin: 0 0 18px; }
    input[type=text], input[type=password] { width: 100%; max-width: 220px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font: inherit; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .msg { font-size: .9rem; margin-top: 12px; min-height: 20px; }
    .msg.err { color: var(--accent); }
    .msg.ok { color: #0f9d6f; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
    .stat { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .stat b { display: block; font-size: 1.5rem; color: var(--primary); font-weight: 900; }
    .stat span { font-size: .78rem; color: var(--muted); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
    .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-weight: 700; font-size: .85rem; cursor: pointer; }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .table-wrap { background: #fff; border: 1px solid var(--border); border-radius: 16px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid #f1f3f7; }
    th { font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); background: #fafbfe; }
    tr:last-child td { border-bottom: none; }
    .p-name { font-weight: 700; color: var(--primary); }
    .p-phone { color: var(--primary); font-weight: 700; text-decoration: none; white-space: nowrap; }
    .p-msg { color: var(--muted); max-width: 320px; }
    .p-page { color: #94a3b8; font-size: .78rem; }
    .st { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; padding: 4px 8px; border-radius: 6px; display: inline-block; }
    .st.new { background: rgba(204,34,41,.1); color: var(--accent); }
    .st.inwork { background: rgba(245,196,24,.18); color: #8a6d00; }
    .st.done { background: rgba(16,185,129,.12); color: #0f9d6f; }
    .st.spam { background: #eef1f6; color: #64748b; }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr 1fr; }
      th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6) { display: none; }
    }
  </style>
</head>
<body>
<header class="ph">
  <div class="wrap ph-row">
    <img src="../images/logo.png" alt="Мой Дом">
    <div class="ph-title">Мой<span>Дом</span> · заявки</div>
    <div class="spacer"></div>
    <a class="btn ghost small" href="../index.html">На сайт</a>
    <button class="btn ghost small" id="logout" hidden>Выйти</button>
  </div>
</header>

<main class="wrap">
  <section id="login-view">
    <div class="card">
      <h1>Вход в панель</h1>
      <p>Код придёт в Telegram владельцу. Действует 5 минут.</p>
      <div class="row">
        <button class="btn" id="get-code">Получить код</button>
        <input type="text" id="code" maxlength="6" inputmode="numeric" placeholder="6 цифр" autocomplete="one-time-code" hidden>
        <button class="btn ghost" id="send-code" hidden>Войти</button>
      </div>
      <div class="msg" id="login-msg"></div>
    </div>
  </section>

  <section id="app-view" hidden>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters">
      <button class="chip active" data-status="">Все</button>
      <button class="chip" data-status="new">Новые</button>
      <button class="chip" data-status="inwork">В работе</button>
      <button class="chip" data-status="done">Закрытые</button>
      <button class="chip" data-status="spam">Спам</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>№</th><th>Клиент</th><th>Сообщение</th><th>Статус</th><th>Страница</th><th>Действия</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>Заявок пока нет.</div>
    </div>
    <div class="row" style="margin:18px 0 40px;">
      <button class="btn ghost" id="export">Скачать CSV</button>
      <span class="msg" id="app-msg"></span>
    </div>
  </section>
</main>

<script>
  /* Адрес API заявок (Cloudflare Worker) */
  const API = 'https://moydom-leads.sergeyberlov20.workers.dev';

  const $ = (s) => document.querySelector(s);
  const tokenKey = 'md_admin_token';
  let token = sessionStorage.getItem(tokenKey) || '';
  let statusFilter = '';

  const setMsg = (el, text, cls) => { el.textContent = text || ''; el.className = 'msg' + (cls ? ' ' + cls : ''); };

  async function api(path, options) {
    const opts = options || {};
    const headers = Object.assign({}, opts.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (opts.body) headers['Content-Type'] = 'application/json';
    const r = await fetch(API + path, Object.assign({}, opts, { headers }));
    if (r.status === 401) throw new Error('auth');
    if (!r.ok) throw new Error('http ' + r.status);
    return r;
  }

  function showLogin(text, cls) {
    $('#app-view').hidden = true; $('#login-view').hidden = false; $('#logout').hidden = true;
    if (text) setMsg($('#login-msg'), text, cls);
  }
  function showApp() { $('#login-view').hidden = true; $('#app-view').hidden = false; $('#logout').hidden = false; }

  if (!API) {
    setMsg($('#login-msg'), 'Не задан адрес API: откройте admin/leads.html и впишите адрес воркера в const API.', 'err');
    $('#get-code').disabled = true;
  }

  $('#get-code').addEventListener('click', async () => {
    setMsg($('#login-msg'), 'Отправляем код в Telegram…');
    try {
      await api('/api/admin/login', { method: 'POST' });
      $('#code').hidden = false; $('#send-code').hidden = false; $('#code').focus();
      setMsg($('#login-msg'), 'Код отправлен в Telegram. Введите его ниже.', 'ok');
    } catch (e) {
      setMsg($('#login-msg'), 'Не удалось отправить код. Проверьте адрес API, BOT_TOKEN и ADMIN_IDS.', 'err');
    }
  });

  $('#send-code').addEventListener('click', async () => {
    const code = ($('#code').value || '').trim();
    if (!code) return;
    try {
      const r = await api('/api/admin/verify', { method: 'POST', body: JSON.stringify({ code: code }) });
      const data = await r.json();
      if (!data.token) throw new Error('no token');
      token = data.token;
      sessionStorage.setItem(tokenKey, token);
      await load();
      showApp();
      setMsg($('#login-msg'), '');
    } catch (e) {
      setMsg($('#login-msg'), 'Код неверный или истёк. Запросите новый.', 'err');
    }
  });

  $('#logout').addEventListener('click', async () => {
    try { await api('/api/admin/logout', { method: 'POST' }); } catch (e) {}
    token = ''; sessionStorage.removeItem(tokenKey); showLogin('Вы вышли.');
  });

  /* --- данные --- */
  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(String(s).replace(' ', 'T') + 'Z');
    if (isNaN(d.getTime())) return s;
    return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  async function load() {
    const q = statusFilter ? '?status=' + encodeURIComponent(statusFilter) : '';
    const r = await api('/api/admin/leads' + q);
    const data = await r.json();
    renderStats(data);
    renderRows(data.leads || []);
    await loadStats();
  }

  function renderStats(data) {
    const c = data.counts || {};
    $('#stats').innerHTML = [
      ['Всего заявок', data.total || 0],
      ['Новые', c.new || 0],
      ['В работе', c.inwork || 0],
      ['Закрытые', c.done || 0]
    ].map(([t, v]) => '<div class="stat"><b>' + v + '</b><span>' + t + '</span></div>').join('');
  }

  function renderRows(list) {
    const tbody = $('#rows');
    $('#empty').hidden = list.length > 0;
    tbody.innerHTML = list.map((l) => {
      const buttons = [
        ['inwork', 'В работе'],
        ['done', 'Готово'],
        ['spam', 'Спам']
      ].filter(([s]) => s !== l.status)
        .map(([s, t]) => '<button class="btn ghost small" data-id="' + l.id + '" data-status="' + s + '">' + t + '</button>')
        .join(' ');
      return '<tr>' +
        '<td>' + l.id + '</td>' +
        '<td><div class="p-name">' + esc(l.name || '—') + '</div>' +
        '<a class="p-phone" href="tel:' + esc(String(l.phone).replace(/[^\d+]/g, '')) + '">' + esc(l.phone) + '</a>' +
        '<div class="p-page">' + fmtDate(l.created_at) + '</div></td>' +
        '<td class="p-msg">' + esc(l.message || '—') + '</td>' +
        '<td><span class="st ' + esc(l.status) + '">' + esc(l.status) + '</span></td>' +
        '<td class="p-page">' + esc(l.page || '—') + '</td>' +
        '<td>' + buttons + '</td>' +
        '</tr>';
    }).join('');
  }

  async function loadStats() {
    try {
      const r = await api('/api/admin/stats');
      const s = await r.json();
      const ev = s.events || {};
      const top = (s.topPages || []).map((p) => (p.page || '/') + ' — ' + p.n).join(', ') || 'нет данных';
      $('#app-msg').innerHTML = 'Сегодня заявок: <b>' + (s.today || 0) + '</b> · просмотры (7д): <b>' + (ev.pageview || 0) +
        '</b> · клики «позвонить»: <b>' + (ev.tel_click || 0) + '</b><br>Топ страниц: ' + esc(top);
      $('#app-msg').className = 'msg';
    } catch (e) {}
  }

  $('#rows').addEventListener('click', async (e) => {
    const btn = e.target.closest ? e.target.closest('button[data-id]') : null;
    if (!btn) return;
    const id = Number(btn.getAttribute('data-id'));
    const status = btn.getAttribute('data-status');
    btn.disabled = true;
    try {
      await api('/api/admin/lead', { method: 'POST', body: JSON.stringify({ id: id, status: status }) });
      await load();
    } catch (err) {
      btn.disabled = false;
      alert('Не удалось изменить статус');
    }
  });

  $('#filters').addEventListener('click', (e) => {
    const chip = e.target.closest ? e.target.closest('.chip') : null;
    if (!chip) return;
    document.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
    chip.classList.add('active');
    statusFilter = chip.getAttribute('data-status') || '';
    load().catch(() => {});
  });

  $('#export').addEventListener('click', async () => {
    try {
      const r = await api('/api/admin/export');
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'leads.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    } catch (e) {
      alert('Не удалось скачать CSV');
    }
  });

  /* --- старт --- */
  (async () => {
    if (!API) return showLogin();
    if (!token) return showLogin();
    try {
      const r = await api('/api/admin/me');
      const me = await r.json();
      if (!me.ok) throw new Error('auth');
      await load();
      showApp();
    } catch (e) {
      token = ''; sessionStorage.removeItem(tokenKey); showLogin();
    }
  })();
</script>
</body>
</html>
