<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Миниатюра (Favicon) -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  
  <title>Избранное — Мой Дом</title>
  <meta name="description" content="Ваши избранные объекты недвижимости в Мариуполе.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="container nav">
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Мой Дом" class="logo-img">
      <div class="logo-text">
        <div class="logo-title">Мой<span>Дом</span></div>
        <div class="logo-subtitle">Мультицентр недвижимости</div>
      </div>
    </a>
    <div class="nav-right">
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="catalog.html">Каталог</a></li>
        <li><a href="services.html">Услуги</a></li>
        <li><a href="about.html">О нас</a></li>
        <li><a href="contacts.html">Контакты</a></li>
        <li><a href="favorites.html" class="active" style="color:#cc2229; font-weight:bold;">❤ Избранное</a></li>
      </ul>
      
      <div class="social-icons">
        <a href="https://t.me/nevizhimost_mariupol" target="_blank" title="Telegram" class="social-tg"></a>
        <a href="https://vk.com/moy_dom_mariupol" target="_blank" title="ВКонтакте" class="social-vk"></a>
        <a href="https://max.ru/nedvizhimost_mariupol" target="_blank" title="MAX" class="social-max"></a>
      </div>

      <button class="mobile-menu-btn" id="mobile-menu-btn">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<section class="container">
  <h1 class="section-title">Избранные объекты</h1>
  <div class="objects-grid" id="favorites-grid"></div>
</section>

<button id="scrollTopBtn" title="Наверх">&#8593;</button>

<footer>
  <div class="container">
    <div class="copyright">© 2026 Мой Дом. Все права защищены.</div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('favorites-grid');
    const favIds = getFavorites();
    
    if (favIds.length === 0) {
      grid.innerHTML = '<div class="empty-favorites">У вас пока нет избранных объектов. Перейдите в <a href="catalog.html" style="color:var(--accent); text-decoration:underline;">каталог</a> и нажмите на сердечко, чтобы сохранить квартиру.</div>';
    } else {
      const favObjects = OBJECTS.filter(o => favIds.includes(o.id));
      favObjects.forEach(obj => {
        grid.insertAdjacentHTML('beforeend', renderCard(obj));
      });
    }

    function renderCard(o) {
      let sliderBtns = '';
      if (o.images && o.images.length > 1) {
        sliderBtns = `<button class="card-slider-btn prev">&#10094;</button><button class="card-slider-btn next">&#10095;</button>`;
      }
      const isFav = isFavorite(o.id) ? 'active' : '';

      return `
        <article class="card">
          <div class="card-img-wrapper" data-images='${JSON.stringify(o.images || [o.image])}'>
            <div class="card-img" style="background-image:url('${o.image}')"></div>
            <span class="card-badge">${o.deal}</span>
            <button class="favorite-btn ${isFav}" onclick="event.preventDefault(); event.stopPropagation(); toggleFavorite(${o.id}, this)">♥</button>
            ${sliderBtns}
          </div>
          <div class="card-body">
            <div class="card-price">${formatPrice(o.price, o.deal)}</div>
            <div class="card-title">${o.title}</div>
            <div class="card-meta">${o.address}</div>
            <a href="object.html?id=${o.id}" class="btn">Подробнее</a>
          </div>
        </article>`;
    }

    setTimeout(() => { if (window.initMiniSliders) window.initMiniSliders(); }, 100);
  });
</script>
</body>
</html>
