<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="theme-color" content="#1c2e5a">
  <link rel="icon" type="image/png" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  
  <title>Избранное — Мой Дом</title>
  <meta name="description" content="Ваши избранные объекты недвижимости в Мариуполе.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="container nav">
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Мой Дом" class="logo-img">
      <div class="logo-text">
        <div class="logo-title">Мой<span>Дом</span></div>
        <div class="logo-subtitle">Мультицентр недвижимости</div>
      </div>
    </a>
    <div class="nav-right">
      <ul id="main-nav">
        <li><a href="index.html">Главная</a></li>
        <li><a href="catalog.html">Каталог</a></li>
        <li><a href="services.html">Услуги</a></li>
        <li><a href="about.html">О нас</a></li>
        <li><a href="contacts.html">Контакты</a></li>
        <li>
          <a href="favorites.html" class="active">
            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
            Избранное
          </a>
        </li>
      </ul>
      
      <div class="social-icons">
        <a href="https://t.me/nevizhimost_mariupol" target="_blank" title="Telegram" class="social-tg"></a>
        <a href="https://vk.com/moy_dom_mariupol" target="_blank" title="ВКонтакте" class="social-vk"></a>
        <a href="https://max.ru/nedvizhimost_mariupol" target="_blank" title="MAX" class="social-max"></a>
      </div>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<section class="container">
  <h1 class="section-title">Избранные объекты</h1>
  <div class="objects-grid" id="favorites-grid"></div>
</section>

<button id="scrollTopBtn" title="Наверх" aria-label="Наверх">
  <svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
</button>

<footer>
  <div class="container">
    <div class="copyright">© 2026 Мой Дом. Все права защищены.</div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('dataLoaded', () => {
    const grid = document.getElementById('favorites-grid');
    const favIds = getFavorites();
    
    if (favIds.length === 0) {
      grid.innerHTML = '<div class="empty-favorites">У вас пока нет избранных объектов. Перейдите в <a href="catalog.html" style="color:var(--accent); text-decoration:underline;">каталог</a> и нажмите на закладку, чтобы сохранить квартиру.</div>';
    } else {
      const favObjects = OBJECTS.filter(o => favIds.includes(o.id));
      favObjects.forEach(obj => {
        grid.insertAdjacentHTML('beforeend', renderCard(obj));
      });
    }

    setTimeout(() => { if (window.initMiniSliders) window.initMiniSliders(); }, 100);
  });
</script>
</body>
</html>
