  <style>
    .contacts-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 40px 0 80px; align-items: start; }
    .contact-card { background: var(--surface); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); }
    .contact-card h2 { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; font-weight: 800; }
    .contact-card p { color: var(--muted); margin-bottom: 30px; font-size: 1rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; background: #f8f9fa; transition: all 0.2s; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(28, 46, 90, 0.1); }
    .checkbox-group { display: flex; align-items: flex-start; gap: 12px; margin: 24px 0; font-size: 0.85rem; color: var(--muted); line-height: 1.4; cursor: pointer; }
    .checkbox-group:hover { color: var(--text); }
    .checkbox-group input { margin-top: 2px; width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
    .checkbox-group a { color: var(--accent); text-decoration: none; }
    .checkbox-group a:hover { text-decoration: underline; }
    .info-list { list-style: none; padding: 0; margin: 0 0 30px 0; }
    .info-list li { display: flex; gap: 16px; margin-bottom: 24px; align-items: flex-start; }
    .info-list svg { width: 24px; height: 24px; fill: var(--accent); flex-shrink: 0; margin-top: 2px; }
    .info-list div strong { display: block; font-size: 1.1rem; color: var(--text); margin-bottom: 4px; }
    .info-list div span { color: var(--muted); font-size: 0.95rem; }
    .map-wrapper { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); line-height: 0; }
    @media (max-width: 900px) { .contacts-layout { grid-template-columns: 1fr; gap: 30px; } .contact-card { padding: 24px; } }
  </style>
